const p0 = document.getElementById('p0');
const p1 = document.getElementById('p1');
const p2 = document.getElementById('p2');
p0.src = TARGETS.dusk;
p1.src = TARGETS.sugar;
p2.src = TARGETS.window;

const logEl = document.getElementById('log');
const barEl = document.getElementById('bar');
const btn = document.getElementById('goBtn');

async function loadCompiler() {
  const urls = [
    'https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js',
    'https://fastly.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js',
    'https://unpkg.com/mind-ar@1.2.5/dist/mindar-image.prod.js'
  ];
  for (const u of urls) {
    try {
      const m = await import(u);
      const C = m.Compiler || m.default?.Compiler || window.MINDAR?.IMAGE?.Compiler;
      if (C) return C;
    } catch (e) {}
  }
  throw new Error('加载 MindAR 编译器失败，请确保电脑网络可访问 jsdelivr/unpkg');
}

btn.addEventListener('click', async () => {
  btn.disabled = true;
  try {
    logEl.textContent = '正在加载 MindAR 图像特征编译器...';
    barEl.style.width = '10%';
    const Compiler = await loadCompiler();
    await Promise.all([p0.decode(), p1.decode(), p2.decode()]);

    const compiler = new Compiler();
    await compiler.compileImageTargets([p0, p1, p2], (progress) => {
      const pct = Math.round(progress);
      barEl.style.width = (10 + pct * 0.85) + '%';
      logEl.textContent = `正在编译三款玻璃垫特征点：${pct}%`;
    });

    const data = await compiler.exportData();
    const blob = new Blob([data], { type: 'application/octet-stream' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'targets.mind';
    a.click();

    barEl.style.width = '100%';
    logEl.textContent = '✅ 已成功生成并开始下载 targets.mind！请把它和 index.html 一起上传到 GitHub 根目录。';
    btn.textContent = '✅ 重新下载 targets.mind';
    btn.disabled = false;
  } catch (err) {
    logEl.textContent = '❌ 出错了：' + err.message;
    btn.disabled = false;
  }
});
</script>
